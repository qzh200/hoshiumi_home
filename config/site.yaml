# =============================================================================
# 布局
# =============================================================================
layout:
  # bento：size: large 的卡片自动跨整行（网格感）
  # grid ：所有卡片等宽排列
  type: bento

  # 内容最大宽度（px）
  maxWidth: 960px

  # 桌面端列数（1 ~ 4）
  columns: 2

  # 卡片间距（px）
  gap: 20px

  mobile:
    # 移动端列数（1 ~ 2；1 为单列舒适浏览，2 为紧凑网格）
    columns: 1

# =============================================================================
# 主题（颜色全部转译为 CSS 变量，全局统一引用）
# =============================================================================
theme:
  # 默认主题模式：light / dark / system（跟随操作系统）
  default: system

  # 是否显示右上角主题切换按钮；false 时按钮隐藏、强制使用 default
  allowSwitch: true

  # 浅色主题：主色（淡蓝）/ 辅助色（淡粉）/ 强调色（淡紫）
  light:
    background: '#fdfbff'
    primary: '#8da7e8'
    secondary: '#e6a6cb'
    accent: '#b9a7e8'

  # 深色主题：使用深蓝 / 靛蓝基调，避免纯黑
  dark:
    background: '#111426'
    primary: '#9eb8ff'
    secondary: '#e7a8cf'
    accent: '#c4b4ff'

  # 卡片玻璃质感
  card:
    # 圆角（px）
    radius: 24px
    # 毛玻璃模糊量（px）；填 0px 可关闭模糊
    blur: 18px
    # 边框不透明度 0 ~ 1
    borderOpacity: 0.4
    # 卡片底色不透明度 0 ~ 1；越大越接近不透明
    bgOpacity: 0.55

# =============================================================================
# 背景
# =============================================================================
background:
  # aurora：主题色光斑 + 渐变氛围（梦幻星海感）
  # minimal：只保留底色与可选星星 / 噪点，更素净
  type: aurora

  # 可选：整幅背景图片（启用后铺满页面；与 aurora 光斑可叠加）
  image:
    enabled: false
    src: /images/background.webp
    # 图片不透明度 0 ~ 1（默认 0.6）
    # opacity: 0.6

  # 星星（少量克制点缀；位置由固定种子生成，可复现）
  stars:
    enabled: true
    # 星星数量（建议 20 ~ 60）
    count: 30

  # 是否显示柔和模糊光斑（仅 type: aurora 时生效）
  glow: true

  # 极弱噪点颗粒（增加质感，不影响性能）
  noise: true

  # 淡蓝紫粉的柔和渐变氛围
  gradient: true

# =============================================================================
# 动画（CSS 完成，无动画库；克制优先）
# =============================================================================
animation:
  # 总开关：关闭后所有动画均不渲染
  enabled: true

  entrance:
    # Hero 与卡片入场淡入
    enabled: true
    # 相邻卡片入场间隔（毫秒）
    stagger: 80

  card:
    # 卡片悬浮微交互
    hover: true
    # 悬浮上移距离（px，负数向上）
    translateY: -4

  background:
    # 背景光斑缓慢漂移 / 星星闪烁
    enabled: true
    # 漂移速度：slow / normal / fast
    speed: slow

  # 尊重系统「减少动态效果」偏好：开启后自动禁用背景运动与入场动画
  respectReducedMotion: true

# =============================================================================
# 页脚
# =============================================================================
footer:
  enabled: true

  # 第一行：站点名
  title: Hoshiumi · 星海日和

  # 第二行：描述
  description: 于群星与潮汐之间，记录旅途与幻想

  # 第三行：版权。{year} 会按 site.startYear 自动展开
  #   例如 startYear=2026 且当前为 2028 → “© 2026–2028 Hoshiumi”
  copyright: '© {year} Hoshiumi'

# =============================================================================
# SEO（无配置项可删；title / description 建议与 site 保持同步）
# =============================================================================
seo:
  # 浏览器标签页标题
  title: Hoshiumi · 星海日和

  # 页面描述
  description: 于群星与潮汐之间，记录旅途与幻想

  # 规范链接（建议带上末尾斜杠）
  canonical: https://hoshiumi.xyz/

  # Open Graph（社交分享卡片）
  openGraph:
    enabled: true
    # 分享大图；留空时自动使用 site.defaultOgImage
    image: /images/og.svg

  # Twitter / X 卡片
  twitter:
    enabled: true
    # summary_large_image（大图）/ summary（小图）
    card: summary_large_image
