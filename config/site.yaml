# =============================================================================
# site.yaml —— 站点配置（唯一需要你关心的文件）
# =============================================================================
# 本主题是「配置驱动」的：修改本文件 + 替换 public/ 下的图片即可完成自定义，
# 不需要修改任何 .astro / .ts / .css 源码。
#
# 修改后重新构建即可生效：
#   pnpm build
#
# 若配置不合法（缺字段 / 格式错误 / 枚举越界……），
# 构建会直接失败并给出精确到字段的中文提示。
# =============================================================================

# =============================================================================
# 站点基本信息
# =============================================================================
site:
  # 网站名称（英文 / 主名，用于 <html>、OG 与页脚等处）
  title: Hoshiumi

  # 别名 / 中文名（会显示在标题、OG alternateName 等处）
  alternate: 星海日和

  # 一句话副标题（用于页脚等位置）
  subtitle: 于群星与潮汐之间，记录旅途与幻想

  # 站点描述（SEO description 的兜底值）
  description: 于群星与潮汐之间，记录旅途与幻想

  # 站点主域名（不要带末尾斜杠）
  url: https://hoshiumi.xyz

  # <html lang>，请填写合法语言标签
  language: zh-CN

  # IANA 时区（目前仅用于元数据，保留给未来扩展）
  timezone: Asia/Shanghai

  # 网站图标（放在 public/ 下，路径以 / 开头）
  favicon: /favicon.svg

  # 头像图片（Hero 中展示，圆形裁切，建议正方形 1:1）
  avatar: /images/avatar.svg

  # 默认 Open Graph 分享图（当 seo.openGraph.image 未设置时使用）
  defaultOgImage: /images/og.svg

  # 建站年份：页脚版权自动按此计算
  #   当前年份 == startYear →  © 2026 Hoshiumi
  #   当前年份 >  startYear →  © 2026–2028 Hoshiumi
  startYear: 2026

  # SEO 关键词（可选，会写入 <meta name="keywords">）
  keywords:
    - Hoshiumi
    - 星海日和
    - 个人主页
    - 博客

# =============================================================================
# Hero（首屏标题区）
# =============================================================================
hero:
  # 是否显示 Hero 区块
  enabled: true

  # 大标题（h1）
  title: Hoshiumi

  # 副标题 / 中文名（大字号字距排布）
  subtitle: 星海日和

  # 描述文字：支持多行（| 后的每一行换行展示）
  description: |
    于群星与潮汐之间，
    记录旅途与幻想

  # 头像：是否在标题上方显示 site.avatar
  # 整个 avatar 块可整体删除（等同不显示）
  avatar:
    enabled: true

  # 英文装饰语：一行细小的斜体点缀
  # 整个 decoration 块可整体删除（等同不显示）
  decoration:
    enabled: true
    text: Across the stars and tides

# =============================================================================
# 站点链接（每项自动生成一张卡片，顺序即展示顺序）
# =============================================================================
# 字段说明：
#   id          必填，唯一标识（只能包含字母、数字、_、-）
#   enabled     是否显示；false 时该卡片不渲染
#   title       英文标题（卡片主标题）
#   name        中文名 / 别名（副标题）
#   description 一句话描述
#   url         链接地址：站内路径以 / 开头；站外填写完整 http(s) 地址
#   displayUrl  卡片上展示的地址文字（可选）
#               留空时自动从 url 推导（如 blog.hoshiumi.xyz）
#   icon        图标：lucide:图标名，可到 https://lucide.dev/icons 查找
#   size        large（跨整行大卡）/ normal / small
#   featured    是否置顶展示（true 的大卡排在最前）
# -----------------------------------------------------------------------------
# 添加新站点：复制下面任意一段，改 id/标题/地址/图标即可，无需改任何源码。
# 隐藏站点：把 enabled 改为 false。
# =============================================================================
links:
  - id: blog
    enabled: true

    title: Blog
    name: 星海日和
    description: 技术 · 游戏 · 生活

    url: https://blog.hoshiumi.xyz
    displayUrl: blog.hoshiumi.xyz

    icon: lucide:book-open

    featured: true
    size: large

  - id: r2
    enabled: true

    title: R2
    name: 星海云仓
    description: 文件与资源

    url: https://r2.hoshiumi.xyz
    displayUrl: r2.hoshiumi.xyz

    icon: lucide:cloud

    featured: false
    size: normal

  - id: status
    enabled: true

    title: Status
    name: 星海信标
    description: 服务运行状态

    url: https://status.hoshiumi.xyz
    displayUrl: status.hoshiumi.xyz

    icon: lucide:activity

    featured: false
    size: normal

  - id: comment
    enabled: true

    title: Comment
    name: 星语
    description: 评论与互动

    url: https://comment.hoshiumi.xyz
    displayUrl: comment.hoshiumi.xyz

    icon: lucide:message-circle

    featured: false
    size: normal

  - id: sink
    enabled: true

    title: Sink
    name: 星链
    description: 短链接服务

    url: https://sink.hoshiumi.xyz
    displayUrl: sink.hoshiumi.xyz

    icon: lucide:link

    featured: false
    size: normal

# -----------------------------------------------------------------------------
# 参考：一个普通的站外链接卡片示例（取消注释即可使用）
# -----------------------------------------------------------------------------
#  - id: github
#    enabled: false
#    title: GitHub
#    name: 我的代码
