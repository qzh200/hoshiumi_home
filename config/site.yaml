# =============================================================================
# site.yaml —— 站点配置（唯一需要你关心的文件）
# =============================================================================
# 本主题是「配置驱动」的：修改本文件 + 替换 public/ 下的图片即可完成自定义，
# 不需要修改任何 .astro / .ts / .css 源码。
#
# 页面布局为「左简介 / 右卡片」的双栏门户：
#   左侧：头像 + 站名 + 标语 +（可选）社交图标
#   右侧：各子站点的入口卡片
#
# 修改后重新构建即可生效：
#   pnpm build
# 若配置不合法（缺字段 / 格式错误 / 枚举越界……），
# 构建会直接失败并给出精确到字段的中文提示。
# =============================================================================

# =============================================================================
# 站点基本信息
# =============================================================================
site:
  # 网站名称（英文 / 主名）
  title: Hoshiumi

  # 别名 / 中文名
  alternate: 星海日和

  # 一句话副标题
  subtitle: 于群星与潮汐之间，记录旅途与幻想

  # 站点描述（SEO description 的兜底值）
  description: 于群星与潮汐之间，记录旅途与幻想

  # 站点主域名（不要带末尾斜杠）
  url: https://hoshiumi.xyz

  # <html lang>，请填写合法语言标签
  language: zh-CN

  # IANA 时区（目前仅用于元数据，保留给未来扩展）
  timezone: Asia/Shanghai

  # 网站图标（放在 public/ 下，路径以 / 开头）
  favicon: /favicon.svg

  # 头像图片（左侧圆形展示，建议正方形 1:1，如 256×256 以上）
  avatar: /images/avatar.svg

  # 默认 Open Graph 分享图（当 seo.openGraph.image 未设置时使用）
  defaultOgImage: /images/og.svg

  # 建站年份：页脚版权自动按此计算
  #   当前年份 == startYear →  © 2026 Hoshiumi
  #   当前年份 >  startYear →  © 2026–2028 Hoshiumi
  startYear: 2026

  # SEO 关键词（可选，写入 <meta name="keywords">）
  keywords:
    - Hoshiumi
    - 星海日和
    - 个人主页
    - 博客

# =============================================================================
# 左侧简介区
# =============================================================================
hero:
  # 是否显示简介区
  enabled: true

  # 大标题（h1）
  title: Hoshiumi

  # 中文名（字距小字排版）
  subtitle: 星海日和

  # 标语：可单行，也可用 | 写多行（每行独立展示）
  description: 于群星与潮汐之间，记录旅途与幻想

  # 头像：是否在标题上方显示 site.avatar
  # 整个 avatar 块可整体删除（等同不显示）
  avatar:
    enabled: true

  # 英文装饰语（细斜体小字，可选）
  # 整个 decoration 块可整体删除（等同不显示）
  # decoration:
  #   enabled: true
  #   text: Across the stars and tides

# =============================================================================
# 站点链接（右侧卡片，每项自动生成一张，顺序即展示顺序）
# =============================================================================
# 字段说明：
#   id          必填，唯一标识（只能包含字母、数字、_、-）
#   enabled     是否显示；false 时该卡片不渲染
#   title       英文标题（卡片主标题）
#   name        中文名 / 别名（标题旁的小字）
#   description 一句话描述
#   url         链接地址：站内路径以 / 开头；站外填写完整 http(s) 地址
#   icon        图标：lucide:图标名，可到 https://lucide.dev/icons 查找
#
# （可选字段，仅当你把 layout.type 改成 bento 时才有意义，可省略）
#   featured    true 表示置顶优先
#   size        large（跨整行大卡）/ normal / small
# -----------------------------------------------------------------------------
# 添加新站点：复制任意一段，改 id / 标题 / 地址 / 图标即可，无需改任何源码。
# 隐藏站点：把 enabled 改为 false。
# =============================================================================
links:
  - id: blog
    enabled: true
    title: Blog
    name: 星海日和
    description: 技术 · 游戏 · 生活
    url: https://blog.hoshiumi.xyz
    icon: lucide:book-open

  - id: r2
    enabled: true
    title: R2
    name: 星海云仓
    description: 文件与资源
    url: https://r2.hoshiumi.xyz
    icon: lucide:cloud

  - id: status
    enabled: true
    title: Status
    name: 星海信标
    description: 服务运行状态
    url: https://status.hoshiumi.xyz
    icon: lucide:activity

  - id: comment
    enabled: true
    title: Comment
    name: 星语
    description: 评论与互动
    url: https://comment.hoshiumi.xyz
    icon: lucide:message-circle

  - id: sink
    enabled: true
    title: Sink
    name: 星链
    description: 短链接服务
    url: https://sink.hoshiumi.xyz
    icon: lucide:link

# -----------------------------------------------------------------------------
# 参考：添加 GitHub 等站外链接（复制并取消注释即可）
# 提示：github / x / telegram / bilibili / wechat 为内置品牌图标兜底，
#       直接写 lucide:github 即可使用（Lucide 上游已移除品牌图标）。
# -----------------------------------------------------------------------------
#  - id: github
#    enabled: true
#    title: GitHub
#    name: 我的代码
#    description: 项目与源码
#    url: https://github.com/qzh200
#    icon: lucide:github

# =============================================================================
# 社交入口（左侧简介下方的小图标行，可选）
# =============================================================================
# 字段说明：
#   label  无障碍名称 / 悬浮提示（必填，尽量用能被读到的名字）
#   url    http(s) 链接或 mailto: 邮箱
#   icon   lucide:图标名（rss / mail 等 Lucide 图标，
#          github / x / telegram / bilibili / wechat 为内置品牌兜底）
# -----------------------------------------------------------------------------
# 需要更多入口时，照下面的格式继续追加即可；不需要的项 enabled: false。
# =============================================================================
social:
  - enabled: true
    label: 订阅 RSS
    url: https://blog.hoshiumi.xyz/rss.xml
    icon: lucide:rss
  - enabled: true
    label: 给我写信（QQ 邮箱）
    url: mailto:2563070658@qq.com
    icon: lucide:mail
  - enabled: true
    label: GitHub
    url: https://github.com/qzh200
    icon: lucide:github

# =============================================================================
# 布局
# =============================================================================
layout:
  # grid：右侧所有卡片等宽（推荐，最安静）
  # bento：size: large 的卡片自动跨整行（信息更重的门户感）
  type: grid

  # 页面内容最大宽度（px）
  maxWidth: 1040px

  # 右侧卡片列数（1 ~ 4；桌面通常 2）
  columns: 2

  # 卡片间距（px）
  gap: 18px

  mobile:
    # 移动端列数（1 为单列舒适浏览，2 为紧凑网格）
    columns: 1

# =============================================================================
# 主题（颜色全部转译为 CSS 变量，全局统一引用）
# =============================================================================
theme:
  # 默认主题模式：light / dark / system（跟随操作系统）
  default: system

  # 是否显示右上角主题切换按钮；false 时按钮隐藏、强制使用 default
  allowSwitch: true

  # 浅色主题：主色（淡蓝）/ 辅助色（淡粉）/ 强调色（淡紫）
  light:
    background: '#fdfbff'
    primary: '#8da7e8'
    secondary: '#e6a6cb'
    accent: '#b9a7e8'

  # 深色主题：深蓝 / 靛蓝基调，避免纯黑
  dark:
    background: '#111426'
    primary: '#9eb8ff'
    secondary: '#e7a8cf'
    accent: '#c4b4ff'

  # 卡片玻璃质感
  card:
    # 圆角（px）
    radius: 22px
    # 毛玻璃模糊量（px）；填 0px 可关闭模糊
    blur: 20px
    # 边框不透明度 0 ~ 1
    borderOpacity: 0.35
    # 卡片底色不透明度 0 ~ 1；越大越接近不透明
    bgOpacity: 0.6

# =============================================================================
# 背景（克制的星海氛围，全部纯 CSS）
# =============================================================================
background:
  # aurora：主题色光斑 + 渐变氛围
  # minimal：只保留底色与可选星星 / 噪点，更素净
  type: aurora

  # 可选：整幅背景图片（启用后铺满页面；与光斑可叠加）
  image:
    enabled: false
    src: /images/background.webp
    # 图片不透明度 0 ~ 1（默认 0.6）
    # opacity: 0.6

  # 星星（少量克制点缀；位置由固定种子生成，构建可复现）
  stars:
    enabled: true
    count: 26

  # 柔和模糊光斑（仅 type: aurora 时生效）
  glow: true

  # 极弱噪点颗粒
  noise: true

  # 淡蓝紫粉的柔和渐变氛围
  gradient: true

# =============================================================================
# 动画（CSS 完成，无动画库；克制优先）
# =============================================================================
animation:
  # 总开关
  enabled: true

  entrance:
    # 简介区与卡片入场淡入
    enabled: true
    # 相邻卡片入场间隔（毫秒）
    stagger: 80

  card:
    # 卡片悬浮微交互
    hover: true
    # 悬浮上移距离（px，负数向上）
    translateY: -3

  background:
    # 背景光斑缓慢漂移 / 星星闪烁
    enabled: true
    # 漂移速度：slow / normal / fast
    speed: slow

  # 尊重系统「减少动态效果」偏好
  respectReducedMotion: true

# =============================================================================
# 页脚（页面底部，极轻量）
# =============================================================================
footer:
  enabled: true

  title: Hoshiumi · 星海日和
  description: 于群星与潮汐之间，记录旅途与幻想

  # {year} 会按 site.startYear 自动展开年份或年份区间
  copyright: '© {year} Hoshiumi'

# =============================================================================
# SEO
# =============================================================================
seo:
  # 浏览器标签页标题
  title: Hoshiumi · 星海日和

  # 页面描述
  description: 于群星与潮汐之间，记录旅途与幻想

  # 规范链接（建议带末尾斜杠）
  canonical: https://hoshiumi.xyz/

  # Open Graph（社交分享卡片）
  openGraph:
    enabled: true
    # 分享大图；留空时自动使用 site.defaultOgImage
    image: /images/og.svg

  # Twitter / X 卡片
  twitter:
    enabled: true
    # summary_large_image（大图）/ summary（小图）
    card: summary_large_image
